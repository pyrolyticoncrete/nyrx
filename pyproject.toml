[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyrx"
version = "1.0.0"
description = "Terminal personal media center (Youtube, Soundcloud, Radio, TV/Movies)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE.md", "LEGAL.md", "PRIVACY.md", "CREDITS.md"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Environment :: Console",
]
dependencies = [
    "lupa==2.8",
    "pillow>=12.2.0",
    "platformdirs>=4.9.1",
    "playwright==1.60.0",
    "pycryptodomex==3.23.0",
    "pyfiglet>=1.0.4",
    "requests>=2.33.1",
    "rich>=15.0.0",
    "static-ffmpeg>=3.0",
    "textual==8.2.8",
    "textual-image==0.13.2",
    "yt-dlp>=2026.08.19",
]

[project.scripts]
nyrx = "nyrx.main:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.tcss", "*.lua", "*.json", "*.json.gz"]

[project.urls]
Homepage = "https://github.com/pyrolyticoncrete/nyrx"

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff", "mypy", "types-requests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["playwright.*", "yt_dlp.*", "lupa.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["nyrx"]
omit = ["tests/*"]
concurrency = ["thread"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::ResourceWarning"]
norecursedirs = [".git", ".venv", "__pycache__"]
